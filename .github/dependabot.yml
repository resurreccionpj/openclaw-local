version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /command-center-archive
      - /services/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /command-center-archive
      - /services/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
